# Build and publish the headless hub image to GitHub Container Registry.
#
# Versioning: the image is tagged with the workspace version read from
# Cargo.toml, so it tracks the upstream release version automatically — when
# you `git pull upstream` and the version bumps (e.g. 0.5.4 -> 0.5.5), the
# next push to main publishes :0.5.5 with no manual tagging.
#
# Tags published (read from the `tags:` block below):
#   - always (every trigger) -> :<cargo-version>, :<cargo-version>-<sha>
#   - push to main           -> also :latest
#   - push of a git tag v*   -> also :<semver>, and :<major>.<minor> unless the
#                               tag is a pre-release. v0.5.4-fork.1 therefore
#                               adds only :0.5.4-fork.1; v1.2.3 adds :1.2.3
#                               and :1.2
#   - manual run             -> only the two always-published tags
#
# :<cargo-version>      moves to the newest build of that version.
# :<cargo-version>-<sha> is immutable — pin this on the server for repeatable deploys.
#
# On the server:  docker compose pull && docker compose up -d
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Read workspace version
        id: vars
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=${{ steps.vars.outputs.version }}-${{ steps.vars.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
