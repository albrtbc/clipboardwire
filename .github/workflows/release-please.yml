# release-please, run by hand only.
#
# This fork tags its releases manually as `v<upstream>-fork.N` (for example
# `v0.5.4-fork.1`) and takes its version number from upstream through merges,
# so release-please must not open release PRs or tag on its own. It would
# propose a version that does not exist upstream and could tag an old one.
# It is kept, with `.release-please-manifest.json` at the upstream version, so
# it can still be started from the Actions tab (workflow_dispatch) if wanted.
#
# When run, release-please reads Conventional Commits, keeps a "release PR"
# open that bumps the version (Cargo.toml [workspace.package]) and updates
# CHANGELOG.md, and merging that PR creates the GitHub Release + the `vX.Y.Z`
# tag. Tags created with the default GITHUB_TOKEN do NOT trigger other
# workflows (GitHub's anti-recursion rule), so set a repo secret
# RELEASE_PLEASE_TOKEN to a fine-grained PAT if `release.yml` and `docker.yml`
# should fire from that tag.
name: release-please

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
