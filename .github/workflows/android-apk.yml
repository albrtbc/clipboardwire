# Build the Android client APK and publish it as a downloadable artifact.
#
# Upstream's release.yml attaches an APK to each tagged release. Its manual
# build-apk.yml is broken on main (it builds -p clipboardwire-android-bridge,
# which is not a workspace member). This fork workflow builds a debug APK on
# every push to main and on v* tags, so it can be downloaded without a local
# Android toolchain.
#
# Every CI run signs the debug APK with a new throwaway debug key, so a CI
# APK can't upgrade an app installed from an earlier build (the signatures
# differ); uninstall first. To get in-place upgrades, build locally with a
# kept debug keystore (see DEPLOYMENT.md).
#
# Get the APK: Actions -> this run -> Artifacts -> clipboardwire-apk.
name: android-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: clipboardwire-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
